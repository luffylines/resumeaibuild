name: Validate ResumeBuilder

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: AI provider fallback checks (mocked, no secrets)
        run: node scripts/check-ai-fallback.cjs
      - name: MFA verified vs unverified factor checks
        run: node scripts/check-mfa-factors.cjs
      - name: Administrator OAuth and role authorization checks
        run: node scripts/check-admin-login.cjs
      - name: Administrator live-data and private-entry regression checks
        run: node scripts/check-admin-data.cjs
      - name: Education levels, year ranges and legacy resumes
        run: node scripts/check-education.cjs
      - name: Profile avatar persistence, cloud verification and retry regression tests
        run: node scripts/check-profile-photo.cjs
      - name: Next.js production build
        run: npm run build
      - name: Smoke test website routes (demo mode)
        shell: bash
        run: |
          npm start > /tmp/resume-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /guide /demo /signup /login /forgot-password /auth/reset /app /admin/login /admin/preview; do
            code=$(curl --silent --show-error --output /tmp/resumebuilder-page.html --write-out "%{http_code}" "http://127.0.0.1:3000$route")
            echo "$route → HTTP $code"
            if [ "$code" != "200" ]; then
              cat /tmp/resume-next.log
              exit 1
            fi
          done
          redirect=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/admin)
          echo '/admin → HTTP' "$redirect" '(login redirect)'
          if [ "$redirect" != '307' ] && [ "$redirect" != '308' ]; then exit 1; fi
      - name: Use runner Chrome for responsive UI tests
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Responsive navigation and overflow checks
        shell: bash
        run: |
          npm start > /tmp/resume-mobile.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:responsive
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: test-screenshots
          if-no-files-found: ignore
          retention-days: 7
